name: Build

on:
  push:
    branches:
      - 'feature/**'
      - 'bug/**'
      - 'chore/**'
      - 'hotfix/**'

jobs:
  build:
    name: Build and push
    uses: aukilabs/github-actions/.github/workflows/javascript-workflow.yml@feature/multi-arch-javascript-workflow
    with:
      enable_build: true
      image_name: ${{ github.event.repository.name }}
      runner: ubuntu-latest
      docker_platforms: linux/amd64,linux/arm64
    secrets:
      aws_access_key: ${{ secrets.GLOBAL_COMMON_AWS_ACCESS_KEY }}
      aws_secret_access_key: ${{ secrets.GLOBAL_COMMON_AWS_SECRET_ACCESS_KEY }}
      aws_region: ${{ secrets.GLOBAL_COMMON_AWS_REGION }}
