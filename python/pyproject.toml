[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsc"
version = "0.1.0"
description = "Python library for Domain Spatial Computer pathfinding, raycasting, and navmesh operations"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pillow>=10.0",
  "pydantic-settings>=2.0",
  "pynavmesh>=1.0",
  "python-dotenv>=1.0",
  "trimesh>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
